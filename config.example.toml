# term-notes configuration for iTerm2.
# Copy to ~/.config/term-notes/config.toml. Every setting is optional.
# Changes apply on the next save, except [keys], which needs a script
# restart (Scripts > Manage > Console > restart).
# WezTerm users pass the same settings to apply_to_config() instead.

# Where notes are written.
notes_dir = "~/notes/term-notes"

# Notes file name (".md" is added). Placeholders:
#   {title}  the tab title, e.g. "Fix-login-bug"
#   {dir}    the working directory's name when the note is saved
#   {id}     a short id for the tab
# Without {id} (the default), tabs with the same title share a file, so a
# reopened tab or a reconnected SSH session keeps its notes. With {id}, e.g.
# "{title}_{id}", every tab (and split pane) gets its own file, renamed when
# the tab's title changes.
file_name = "{title}"

# Add the git repo and branch of the working directory to each note.
git_context = true

# How the "open notes" shortcut shows notes: "split" (a pane running
# split_command) or "app" (your default app for .md files).
open_in = "split"
split_command = "less -R +G"

# Shortcuts: modifiers (ctrl, alt/opt, shift, cmd) plus a letter or digit.
# Set one to "" to disable it.
[keys]
save = "ctrl+alt+h"
save_with_comment = "ctrl+alt+shift+h"
open_notes = "ctrl+alt+n"
undo = "ctrl+alt+z"
