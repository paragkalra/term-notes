[project]
name = "term-notes"
version = "0.1.0"
description = "Save selected terminal text as Markdown notes (iTerm2 + WezTerm)"
license = "MIT"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:iterm2.*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# iterm2.Reference(...) as an argument default is how iTerm2 RPCs receive
# context, so B008 doesn't apply.
ignore = ["B008"]
